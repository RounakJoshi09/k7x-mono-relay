<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tally Database Loader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="./styles.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <header class="bg-primary text-white p-3">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <i class="bi bi-database-gear fs-2 me-3"></i>
                    <div>
                        <h1 class="h3 mb-0">Tally Database Loader</h1>
                        <small>Synchronize Tally Prime data with databases</small>
                    </div>
                </div>
                <div class="d-flex align-items-center">
                    <div class="status-indicator me-3">
                        <span id="connection-status" class="badge bg-secondary">
                            <i class="bi bi-circle-fill"></i> Ready
                        </span>
                    </div>
                    <span id="app-version" class="small text-light opacity-75">v1.0.0</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="row" style="overflow-y: scroll;">
            <!-- Configuration Panel -->
            <div class="col-md-8">
                <div class="card h-100">
                    <div class="card-header">
                        <ul class="nav nav-tabs card-header-tabs" id="config-tabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="database-tab" data-bs-toggle="tab" 
                                    data-bs-target="#database-panel" type="button" role="tab">
                                    <i class="bi bi-database"></i> Database
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="tally-tab" data-bs-toggle="tab" 
                                    data-bs-target="#tally-panel" type="button" role="tab">
                                    <i class="bi bi-building"></i> Tally
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="advanced-tab" data-bs-toggle="tab" 
                                    data-bs-target="#advanced-panel" type="button" role="tab">
                                    <i class="bi bi-gear"></i> Advanced
                                </button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body">
                        <div class="tab-content" id="config-tab-content">
                            <!-- Database Configuration -->
                            <div class="tab-pane fade show active" id="database-panel" role="tabpanel">
                                <form id="database-form">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="db-technology" class="form-label">Database Technology</label>
                                                <select class="form-select" id="db-technology" required>
                                                    <option value="mysql">MySQL</option>
                                                    <option value="mssql">SQL Server</option>
                                                    <option value="postgres">PostgreSQL</option>
                                                    <option value="bigquery">Google BigQuery</option>
                                                    <option value="adls">Azure Data Lake</option>
                                                    <option value="csv">CSV Files</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="db-load-method" class="form-label">Load Method</label>
                                                <select class="form-select" id="db-load-method" required>
                                                    <option value="insert">Insert</option>
                                                    <option value="file">Bulk Load</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-8">
                                            <div class="mb-3">
                                                <label for="db-server" class="form-label">Server</label>
                                                <input type="text" class="form-control" id="db-server" 
                                                    placeholder="localhost or IP address" required>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="mb-3">
                                                <label for="db-port" class="form-label">Port</label>
                                                <input type="number" class="form-control" id="db-port" 
                                                    min="1" max="65535" required>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="mb-3">
                                                <label for="db-schema" class="form-label">Schema/Database</label>
                                                <input type="text" class="form-control" id="db-schema" 
                                                    placeholder="Database name" required>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="mb-3">
                                                <label for="db-username" class="form-label">Username</label>
                                                <input type="text" class="form-control" id="db-username" required>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="mb-3">
                                                <label for="db-password" class="form-label">Password</label>
                                                <input type="password" class="form-control" id="db-password" required>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-12">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="db-ssl">
                                                <label class="form-check-label" for="db-ssl">
                                                    Use SSL Connection
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- SSH Tunnel Configuration -->
                                    <div class="mt-4">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="ssh-enabled">
                                            <label class="form-check-label" for="ssh-enabled">
                                                <strong>Enable SSH Tunnel</strong>
                                            </label>
                                        </div>
                                        
                                        <div id="ssh-config" class="mt-3" style="display: none;">
                                            <div class="row">
                                                <div class="col-md-8">
                                                    <div class="mb-3">
                                                        <label for="ssh-host" class="form-label">SSH Host</label>
                                                        <input type="text" class="form-control" id="ssh-host" 
                                                            placeholder="SSH server hostname or IP">
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="mb-3">
                                                        <label for="ssh-port" class="form-label">SSH Port</label>
                                                        <input type="number" class="form-control" id="ssh-port" 
                                                            value="22" min="1" max="65535">
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div class="row">
                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="ssh-username" class="form-label">SSH Username</label>
                                                        <input type="text" class="form-control" id="ssh-username">
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="ssh-password" class="form-label">SSH Password</label>
                                                        <input type="password" class="form-control" id="ssh-password">
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div class="row">
                                                <div class="col-md-12">
                                                    <div class="mb-3">
                                                        <label for="ssh-private-key" class="form-label">Private Key (optional)</label>
                                                        <textarea class="form-control" id="ssh-private-key" rows="4" 
                                                            placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div class="row">
                                                <div class="col-md-4">
                                                    <div class="mb-3">
                                                        <label for="ssh-local-port" class="form-label">Local Port</label>
                                                        <input type="number" class="form-control" id="ssh-local-port" 
                                                            value="3307" min="1" max="65535">
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="mb-3">
                                                        <label for="ssh-remote-host" class="form-label">Remote Host</label>
                                                        <input type="text" class="form-control" id="ssh-remote-host" 
                                                            value="localhost">
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="mb-3">
                                                        <label for="ssh-remote-port" class="form-label">Remote Port</label>
                                                        <input type="number" class="form-control" id="ssh-remote-port" 
                                                            value="3306" min="1" max="65535">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="mt-4">
                                        <button type="button" class="btn btn-outline-primary" id="test-db-connection">
                                            <i class="bi bi-plug"></i> Test Connection
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <!-- Tally Configuration -->
                            <div class="tab-pane fade" id="tally-panel" role="tabpanel">
                                <form id="tally-form">
                                    <div class="row">
                                        <div class="col-md-8">
                                            <div class="mb-3">
                                                <label for="tally-server" class="form-label">Tally Server</label>
                                                <input type="text" class="form-control" id="tally-server" 
                                                    placeholder="localhost or Tally server IP" required>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="mb-3">
                                                <label for="tally-port" class="form-label">Port</label>
                                                <input type="number" class="form-control" id="tally-port" 
                                                    value="9000" min="1" max="65535" required>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-12">
                                            <div class="mb-3">
                                                <label for="tally-company" class="form-label">Company Name</label>
                                                <input type="text" class="form-control" id="tally-company" 
                                                    placeholder="Select or enter company name" list="company-list">
                                                <datalist id="company-list"></datalist>
                                                <div class="form-text">Leave empty for currently open company</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="sync-mode" class="form-label">Sync Mode</label>
                                                <select class="form-select" id="sync-mode" required>
                                                    <option value="full">Full Sync</option>
                                                    <option value="incremental">Incremental Sync</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="sync-frequency" class="form-label">Frequency (minutes)</label>
                                                <input type="number" class="form-control" id="sync-frequency" 
                                                    value="0" min="0" max="1440">
                                                <div class="form-text">0 = One-time sync</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-12">
                                            <div class="mb-3">
                                                <label class="form-label">Date Range</label>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="radio" name="date-range" 
                                                        id="date-auto" value="auto" checked>
                                                    <label class="form-check-label" for="date-auto">
                                                        Auto (Current financial year)
                                                    </label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="radio" name="date-range" 
                                                        id="date-custom" value="custom">
                                                    <label class="form-check-label" for="date-custom">
                                                        Custom Date Range
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div id="custom-date-range" class="row" style="display: none;">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="from-date" class="form-label">From Date</label>
                                                <input type="date" class="form-control" id="from-date">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="to-date" class="form-label">To Date</label>
                                                <input type="date" class="form-control" id="to-date">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="mt-4">
                                        <button type="button" class="btn btn-outline-primary me-2" id="test-tally-connection">
                                            <i class="bi bi-plug"></i> Test Connection
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary" id="load-companies">
                                            <i class="bi bi-building"></i> Load Companies
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <!-- Advanced Configuration -->
                            <div class="tab-pane fade" id="advanced-panel" role="tabpanel">
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="mb-3">
                                            <label for="definition-file" class="form-label">Definition File</label>
                                            <select class="form-select" id="definition-file">
                                                <option value="tally-export-config.yaml">Full Export (tally-export-config.yaml)</option>
                                                <option value="tally-export-config-incremental.yaml">Incremental Export (tally-export-config-incremental.yaml)</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-12">
                                        <h6>Performance Settings</h6>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="truncate-tables" checked>
                                            <label class="form-check-label" for="truncate-tables">
                                                Truncate tables before sync
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="import-master" checked>
                                            <label class="form-check-label" for="import-master">
                                                Import master data
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="import-transactions" checked>
                                            <label class="form-check-label" for="import-transactions">
                                                Import transaction data
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div class="mt-4">
                                    <h6>Backup & Restore</h6>
                                    <div class="d-flex gap-2">
                                        <button type="button" class="btn btn-outline-secondary" id="export-config">
                                            <i class="bi bi-download"></i> Export Configuration
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary" id="import-config">
                                            <i class="bi bi-upload"></i> Import Configuration
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Status & Control Panel -->
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-activity"></i> Sync Status
                        </h5>
                        <div class="btn-group btn-group-sm">
                            <button type="button" class="btn btn-outline-secondary" id="refresh-status">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <!-- Status Display -->
                        <div class="status-display mb-4">
                            <div class="sync-status-card p-3 border rounded">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="fw-bold">Current Status:</span>
                                    <span id="sync-status-text" class="badge bg-secondary">Ready</span>
                                </div>
                                <div class="progress mb-2" style="height: 8px;">
                                    <div id="sync-progress-bar" class="progress-bar" role="progressbar" 
                                        style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                                <div class="small text-muted">
                                    <div id="current-table">-</div>
                                    <div id="sync-times"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Control Buttons -->
                        <div class="control-buttons mb-4">
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-success btn-lg" id="start-sync">
                                    <i class="bi bi-play-circle"></i> Start Sync
                                </button>
                                <button type="button" class="btn btn-danger" id="stop-sync" disabled>
                                    <i class="bi bi-stop-circle"></i> Stop Sync
                                </button>
                            </div>
                        </div>

                        <!-- Quick Actions -->
                        <div class="quick-actions mb-4">
                            <h6>Quick Actions</h6>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-outline-primary btn-sm" id="save-config">
                                    <i class="bi bi-save"></i> Save Configuration
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="load-config">
                                    <i class="bi bi-folder-open"></i> Load Configuration
                                </button>
                                <button type="button" class="btn btn-outline-info btn-sm" id="view-database-structure">
                                    <i class="bi bi-diagram-3"></i> Database Structure
                                </button>
                            </div>
                        </div>

                        <!-- Log Display -->
                        <div class="log-display flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="mb-0">Recent Logs</h6>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="clear-logs">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                            <div id="log-container" class="log-output border rounded p-2 small" 
                                style="height: 200px; overflow-y: auto; background-color: #f8f9fa; font-family: monospace;">
                                <div class="text-muted">Logs will appear here...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <!-- Modal for Database Structure -->
    <div class="modal fade" id="database-structure-modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Database Structure</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <pre id="database-structure-content" class="small"></pre>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./app.js"></script>
</body>
</html>
